<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coretax Exsociothree</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:420px;
    background:white;
    border-radius:28px;
    padding:35px 25px;
    box-shadow:0 25px 70px rgba(0,0,0,0.25);
    text-align:center;
    animation:fadeIn 1s ease;
}

/* ========================= */
/* LOADER CHECK ANIMATION */
/* ========================= */

.top-check{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:28px;
}

.loader-check{
    width:75px;
    height:75px;
    position:relative;
}

.loader-check svg{
    width:100%;
    height:100%;
}

.circle-bg{
    fill:none;
    stroke:#e8f5e9;
    stroke-width:8;
}

.circle-progress{
    fill:none;
    stroke:#4caf50;
    stroke-width:8;
    stroke-linecap:round;

    stroke-dasharray:314;
    stroke-dashoffset:314;

    transform-origin:center;
    transform:rotate(-90deg);
    animation:loadingCircle 2.8s ease-in-out infinite;
}

.check-path{
    fill:none;
    stroke:#4caf50;
    stroke-width:6;
    stroke-linecap:round;
    stroke-linejoin:round;

    stroke-dasharray:80;
    stroke-dashoffset:80;

    animation:drawCheck 2.8s ease-in-out infinite;
}

.status-text{
    margin-top:14px;
    font-size:15px;
    font-weight:600;
    color:#2e7d32;
    animation:fadeText 2.8s infinite;
}

/* ===================== */
/* TITLE */
/* ===================== */

h1{
    color:#333;
    font-size:28px;
    margin-bottom:8px;
}

.subtitle{
    color:#777;
    font-size:14px;
    line-height:1.6;
    margin-bottom:28px;
}

/* ===================== */
/* BALANCE CARD */
/* ===================== */

.balance-card{
    background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
    border-radius:22px;
    padding:32px 22px;
    color:white;
    margin-bottom:24px;
    position:relative;
    overflow:hidden;
}

.balance-card::before{
    content:'';
    position:absolute;
    width:200px;
    height:200px;
    background:rgba(255,255,255,0.1);
    border-radius:50%;
    top:-90px;
    right:-80px;
}

.balance-label{
    font-size:14px;
    opacity:0.9;
    letter-spacing:1px;
    margin-bottom:10px;
}

.balance-amount{
    font-size:clamp(34px, 8vw, 48px);
    font-weight:bold;
}

.balance-source{
    margin-top:12px;
    font-size:13px;
    opacity:0.85;
}

/* ===================== */
/* INFO */
/* ===================== */

.info{
    background:#f5f5f5;
    border-radius:18px;
    padding:15px;
    text-align:left;
}

.info-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:13px 0;
    border-bottom:1px solid #ddd;
    flex-wrap:wrap;
}

.info-row:last-child{
    border-bottom:none;
}

.info-label{
    color:#666;
    font-size:13px;
}

.info-value{
    color:#222;
    font-size:13px;
    font-weight:600;
}

/* ===================== */
/* RESPONSIVE */
/* ===================== */

@media (max-width:480px){

    .container{
        padding:28px 18px;
    }

    h1{
        font-size:24px;
    }

    .balance-card{
        padding:28px 18px;
    }

    .info-row{
        flex-direction:column;
        align-items:flex-start;
    }
}

/* ========================= */
/* ANIMATIONS */
/* ========================= */

@keyframes loadingCircle{

    0%{
        stroke-dashoffset:314;
    }

    40%{
        stroke-dashoffset:0;
    }

    80%{
        stroke-dashoffset:0;
    }

    100%{
        stroke-dashoffset:314;
    }
}

@keyframes drawCheck{

    0%,35%{
        stroke-dashoffset:80;
    }

    50%,80%{
        stroke-dashoffset:0;
    }

    100%{
        stroke-dashoffset:80;
    }
}

@keyframes fadeText{

    0%,100%{
        opacity:0.6;
    }

    50%{
        opacity:1;
    }
}

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- CHECK LOADER -->
    <div class="top-check">

        <div class="loader-check">

            <svg viewBox="0 0 120 120">

                <!-- BACKGROUND -->
                <circle class="circle-bg"
                    cx="60"
                    cy="60"
                    r="50" />

                <!-- LOADING -->
                <circle class="circle-progress"
                    cx="60"
                    cy="60"
                    r="50" />

                <!-- CHECK -->
                <path class="check-path"
                    d="M38 60 L52 74 L84 42" />

            </svg>

        </div>

        <div class="status-text">
            Saldo Tersedia
        </div>

    </div>

    <h1>Coretax Exsociothree</h1>

    <p class="subtitle">
        Informasi saldo subsidi yang diterima
    </p>

    <div class="balance-card">

        <div class="balance-label">
            SALDO SUBSIDI
        </div>

        <div class="balance-amount">
            Rp 50.000,00
        </div>

        <div class="balance-source">
            Subsidi Kas Kelas
        </div>

    </div>

    <div class="info">

        <div class="info-row">
            <span class="info-label">Sumber Dana</span>
            <span class="info-value">Danagatra exsociothree</span>
        </div>

        <div class="info-row">
            <span class="info-label">Jumlah</span>
            <span class="info-value">Rp 1.800.000,00</span>
        </div>

        <div class="info-row">
            <span class="info-label">Status</span>
            <span class="info-value">Diterima</span>
        </div>

        <div class="info-row">
            <span class="info-label">Tanggal</span>
            <span class="info-value">29 April 2026</span>
        </div>

    </div>

</div>

</body>
</html>
